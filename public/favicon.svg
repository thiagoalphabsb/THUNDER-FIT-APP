<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="thunderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D1C1" />
      <stop offset="100%" stop-color="#008f84" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00D1C1" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background rounded rect with gradient border -->
  <rect width="64" height="64" rx="16" fill="url(#thunderGrad)"/>
  <!-- Inner dark card -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="#0A0A0A"/>
  <!-- Thunder Lightning Bolt -->
  <g transform="translate(10, 10) scale(1.833)" filter="url(#glow)">
    <path
      d="M13 2L3 14H12L11 22L21 10H12L13 2Z"
      fill="#00D1C1"
